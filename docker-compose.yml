services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in Coolify}}
      APP_DB_USER: ${APP_DB_USER:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_01_NAME: ${DB_01_NAME:-db_webgis_01}
      DB_WEBGIS_NAME: ${DB_WEBGIS_NAME:-db_webgis}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/health.php --check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in Coolify}
    volumes:
      - db_data_v2:/var/lib/mysql
      - ./docker/init_all_databases.sql:/docker-entrypoint-initdb.d/init_all_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data_v2:
